name: fishbit_finance
description: "FishBit Finance - Precision Aquaculture ERP & Biological Traceability Platform"
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Architecture
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.0.0

  # Supabase Backend & Auth
  supabase_flutter: ^2.5.0

  # Local Persistence & Secure Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # UI / UX, Glassmorphism & Animations
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  intl: ^0.20.3
  fl_chart: ^0.68.0

  # Utilities
  uuid: ^4.4.0
  crypto: ^3.0.3
  url_launcher: ^6.3.2
  video_player: ^2.14.0
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/videos/
    - assets/images/

  fonts:
    - family: FishBitIcons
      fonts:
        - asset: assets/fonts/FishBitIcons.ttf

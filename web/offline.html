<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin Conexión - FishBit</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0A101D;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(16, 26, 44, 0.9);
      border: 1px solid rgba(0, 229, 255, 0.25);
      border-radius: 20px;
      padding: 40px 28px;
      max-width: 440px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6), 0 0 24px rgba(0, 229, 255, 0.1);
      backdrop-filter: blur(12px);
    }
    .icon-container {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: rgba(0, 229, 255, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(0, 229, 255, 0.35);
    }
    .icon-container svg {
      width: 40px;
      height: 40px;
      stroke: #00E5FF;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 1.45rem;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    p {
      color: #94A3B8;
      font-size: 0.95rem;
      line-height: 1.55;
      margin-bottom: 28px;
    }
    .btn-retry {
      background: linear-gradient(135deg, #00E5FF, #0077B6);
      color: #0A101D;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 12px 28px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
    }
    .btn-retry:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 229, 255, 0.45);
    }
    .badge {
      display: inline-block;
      margin-top: 24px;
      font-size: 0.72rem;
      color: #64748B;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">
      <svg viewBox="0 0 24 24">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Sin Conexión a Internet</h1>
    <p>FishBit requiere validar datos o sincronizar recursos de la granja. Revisa tu conectividad WiFi o de datos móviles y vuelve a intentarlo.</p>
    <button class="btn-retry" onclick="window.location.reload()">Reintentar Conexión</button>
    <div>
      <span class="badge">FishBit PWA Offline Shield</span>
    </div>
  </div>
</body>
</html>

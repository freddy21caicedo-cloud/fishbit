<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- SEO & Theme -->
  <meta name="description" content="FishBit - ERP Piscícola & Trazabilidad Biológica">
  <meta name="theme-color" content="#00E5FF">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FishBit">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FishBit - ERP Piscícola</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0A101D;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Splash container */
    #loading-splash {
      position: fixed;
      inset: 0;
      background-color: #0A101D;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.4s ease-out;
    }

    .splash-logo-box {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      background: rgba(16, 26, 44, 0.95);
      border: 1px solid rgba(0, 229, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 35px rgba(0, 229, 255, 0.25);
      margin-bottom: 24px;
      animation: pulse 2s infinite ease-in-out;
    }

    .splash-logo-box img {
      width: 58px;
      height: 58px;
      border-radius: 14px;
    }

    .splash-title {
      color: #FFFFFF;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    .splash-subtitle {
      color: #00E5FF;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 24px;
      opacity: 0.85;
    }

    /* Loading bar */
    .loader-bar-bg {
      width: 140px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .loader-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #00E5FF, transparent);
      position: absolute;
      transform: translateX(-100%);
      animation: loadFlow 1.6s infinite ease-in-out;
    }

    @keyframes loadFlow {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(0, 229, 255, 0.2); }
      50% { transform: scale(1.03); box-shadow: 0 0 40px rgba(0, 229, 255, 0.4); }
    }
  </style>
</head>
<body>
  <!-- Native Splash Screen while Flutter engine warms up -->
  <div id="loading-splash">
    <div class="splash-logo-box">
      <img src="icons/Icon-192.png" alt="FishBit Icon" />
    </div>
    <div class="splash-title">FishBit</div>
    <div class="splash-subtitle">Aquaculture ERP</div>
    <div class="loader-bar-bg">
      <div class="loader-bar-fill"></div>
    </div>
  </div>

  <script>
    // PWA Install Prompt Listener
    window.deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
      window.dispatchEvent(new CustomEvent('fishbit_install_available'));
      console.log('[FishBit PWA] Install prompt capture ready');
    });

    window.addEventListener('appinstalled', () => {
      window.deferredPrompt = null;
      console.log('[FishBit PWA] App installed successfully');
    });

    // Dismiss splash once first frame renders
    window.dismissFishBitSplash = function() {
      const splash = document.getElementById('loading-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 400);
      }
    };

    // Auto-dismiss safety timeout (e.g. max 5 seconds)
    window.addEventListener('flutter-first-frame', () => {
      window.dismissFishBitSplash();
    });
    setTimeout(() => {
      window.dismissFishBitSplash();
    }, 6000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
